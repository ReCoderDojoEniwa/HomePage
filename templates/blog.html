{% extends "base.html" %}

{% block extra_head %}
<link rel="stylesheet" type="text/css" href="{{ get_url(path="blog.css") }}" />
{% endblock %}

{% block content %}
<main>
    <article class="blog-post">
        <h1 style="text-align: center; margin-bottom: 0.5rem;">{{ page.title }}</h1>
        <div style="text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 2rem;">
            <span>{{ page.date | date(format="%Y年%m月%d日") }}</span>
            {% if page.extra.author %}
            <span style="margin-left: 1rem;">著者: {{ page.extra.author }}</span>
            {% endif %}
        </div>

        <div class="blog-content">
            {{ page.content | safe }}
        </div>
    </article>
</main>
{% endblock %}
